<body>

<script>
const SPRITE_DIR = 'src/assets/sprites';

function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w;
  c.height = h;
  c.style.imageRendering = 'pixelated';
  return c;
}

function pixelRect(ctx, x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(x, y, w, h);
}

function putPixel(ctx, x, y, color) {
  ctx.fillStyle = color;
  ctx.fillRect(x, y, 1, 1);
}

function setStatus(msg) {
  document.getElementById('status').textContent = msg;
}

const generatedSprites = {};

function addSprite(containerId, name, canvas) {
  generatedSprites[name] = canvas;
  const container = document.getElementById(containerId);
  const item = document.createElement('div');
  item.className = 'sprite-item';
  const display = makeCanvas(canvas.width * 3, canvas.height * 3);
  const dctx = display.getContext('2d');
  dctx.imageSmoothingEnabled = false;
  dctx.drawImage(canvas, 0, 0, display.width, display.height);
  const label = document.createElement('div');
  label.className = 'label';
  label.textContent = name;
  item.appendChild(display);
  item.appendChild(label);
  container.appendChild(item);
}

// ============ PLAYER SPRITES ============
function drawPlayerIdle() {
  const c = makeCanvas(16, 24);
  const ctx = c.getContext('2d');
  // Simple pixel art knight
  // Helmet
  pixelRect(ctx, 5, 0, 6, 1, '#4a5568');
  pixelRect(ctx, 4, 1, 8, 3, '#4a5568');
  pixelRect(ctx, 4, 4, 8, 1, '#2d3748');
  // Face
  pixelRect(ctx, 5, 5, 6, 4, '#fbd38d');
  putPixel(ctx, 6, 7, '#1a202c');
  putPixel(ctx, 9, 7, '#1a202c');
  pixelRect(ctx, 7, 8, 2, 1, '#e53e3e');
  // Body / armor
  pixelRect(ctx, 4, 9, 8, 6, '#3182ce');
  pixelRect(ctx, 5, 10, 6, 1, '#2b6cb0');
  pixelRect(ctx, 7, 10, 2, 4, '#f7e08b');
  // Belt
  pixelRect(ctx, 4, 15, 8, 1, '#744210');
  pixelRect(ctx, 7, 15, 2, 1, '#d69e2e');
  // Legs
  pixelRect(ctx, 4, 16, 3, 4, '#2d3748');
  pixelRect(ctx, 9, 16, 3, 4, '#2d3748');
  // Boots
  pixelRect(ctx, 4, 20, 3, 2, '#4a5568');
  pixelRect(ctx, 9, 20, 3, 2, '#4a5568');
  // Arms
  pixelRect(ctx, 2, 10, 2, 5, '#fbd38d');
  pixelRect(ctx, 12, 10, 2, 5, '#fbd38d');
  // Sword
  pixelRect(ctx, 13, 4, 1, 12, '#a0aec0');
  pixelRect(ctx, 12, 4, 3, 1, '#e2e8f0');
  pixelRect(ctx, 12, 16, 3, 1, '#744210');

}

// ============ BACKGROUND SPRITES ============
function drawGrassBackground() {
  const c = makeCanvas(64, 48);
  const ctx = c.getContext('2d');
  // Sky gradient
  const grad = ctx.createLinearGradient(0, 0, 0, 32);
  grad.addColorStop(0, '#63b3ed');
  grad.addColorStop(1, '#bee3f8');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 64, 32);
  // Distant mountains
  pixelRect(ctx, 0, 20, 16, 12, '#a0aec0');
  pixelRect(ctx, 4, 16, 10, 4, '#718096');
  pixelRect(ctx, 12, 22, 20, 10, '#a0aec0');
  pixelRect(ctx, 18, 18, 10, 4, '#718096');
  pixelRect(ctx, 30, 24, 34, 8, '#a0aec0');
  pixelRect(ctx, 40, 20, 10, 4, '#718096');
  // Ground grass
  pixelRect(ctx, 0, 32, 64, 16, '#48bb78');
  pixelRect(ctx, 0, 32, 64, 2, '#68d391');
  // Grass blades
  for (let i = 0; i < 20; i++) {
    const x = (i * 3 + 1) % 64;
    const y = 34 + (i % 3) * 2;
    putPixel(ctx, x, y, '#2f855a');
    putPixel(ctx, x + 1, y - 1, '#48bb78');
  }
  // Flowers
  pixelRect(ctx, 10, 38, 2, 2, '#f7e08b');
  pixelRect(ctx, 30, 40, 2, 2, '#e94560');
  pixelRect(ctx, 50, 36, 2, 2, '#fff');
  // Trees
  pixelRect(ctx, 2, 18, 6, 14, '#276749');
  pixelRect(ctx, 3, 16, 4, 4, '#2f855a');
  pixelRect(ctx, 4, 12, 2, 6, '#744210');
  pixelRect(ctx, 54, 14, 8, 18, '#276749');
  pixelRect(ctx, 55, 12, 6, 4, '#2f855a');
  pixelRect(ctx, 57, 8, 2, 8, '#744210');
  return c;
}

function drawNightBackground() {

  grad.addColorStop(0, '#1a202c');
  grad.addColorStop(1, '#2d3748');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 64, 32);
  // Stars
  const stars = [[5,4],[12,8],[20,2],[28,10],[35,6],[42,3],[50,9],[58,5],[8,14],[24,16],[48,14],[15,20],[38,18]];
  for (const [x, y] of stars) {
    putPixel(ctx, x, y, '#fff');
    putPixel(ctx, x, y + 1, '#cbd5e0');
  }
  // Moon
  pixelRect(ctx, 44, 2, 10, 10, '#e2e8f0');
  pixelRect(ctx, 45, 3, 8, 8, '#cbd5e0');
  pixelRect(ctx, 46, 4, 3, 3, '#a0aec0');
  pixelRect(ctx, 50, 6, 3, 3, '#a0aec0');
  // Ground
  pixelRect(ctx, 0, 32, 64, 16, '#2d3748');
  pixelRect(ctx, 0, 32, 64, 2, '#4a5568');
  // Rocks
  pixelRect(ctx, 4, 34, 8, 4, '#4a5568');
  pixelRect(ctx, 50, 36, 10, 4, '#4a5568');

// ============ GENERATE ALL ============
function generateAll() {
  setStatus('正在生成精灵图...');
  
  const sprites = {};
  
  // Player
  sprites['player_idle'] = drawPlayerIdle();
  sprites['player_walk'] = drawPlayerWalk();
  sprites['player_jump'] = drawPlayerJump();
  sprites['player_attack'] = drawPlayerAttack();
  
  // Enemies
  sprites['slime'] = drawSlime();
  sprites['skeleton'] = drawSkeleton();
  sprites['goblin'] = drawGoblin();
  sprites['dark_mage'] = drawDarkMage();
  sprites['armored_knight'] = drawArmoredKnight();
  
  // Bosses
  sprites['dragon_warrior'] = drawDragonWarrior();
  sprites['shadow_lord'] = drawShadowLord();
  sprites['demon_lord'] = drawDemonLord();
  
  // Backgrounds
  sprites['bg_grass'] = drawGrassBackground();
  sprites['bg_night'] = drawNightBackground();
  sprites['bg_hell'] = drawHellBackground();
  
  // Items
  sprites['health_potion'] = drawHealthPotion();
  sprites['mana_potion'] = drawManaPotion();
  sprites['coin'] = drawCoin();
  sprites['fireball'] = drawFireball();
  sprites['dark_bolt'] = drawDarkBolt();
  
  // Tiles
  sprites['tile_grass'] = drawGrassTile();
  sprites['tile_stone'] = drawStoneTile();
  
  // Display all
  document.getElementById('player').innerHTML = '';
  document.getElementById('enemies').innerHTML = '';
  document.getElementById('bosses').innerHTML = '';
  document.getElementById('backgrounds').innerHTML = '';
  document.getElementById('items').innerHTML = '';
  
  for (const [name, canvas] of Object.entries(sprites)) {
    generatedSprites[name] = canvas;
    let section = 'player';
    if (['slime','skeleton','goblin','dark_mage','armored_knight'].includes(name)) section = 'enemies';
    else if (['dragon_warrior','shadow_lord','demon_lord'].includes(name)) section = 'bosses';
    else if (name.startsWith('bg_')) section = 'backgrounds';
    else section = 'items';
    addSprite(section, name, canvas);
  }
  
  setStatus(`✅ 已生成 ${Object.keys(sprites).length} 个精灵图！点击"下载所有精灵图"保存`);
}

function downloadAll() {
  setStatus('正在下载精灵图...');
  const promises = [];
  for (const [name, canvas] of Object.entries(generatedSprites)) {
    const promise = new Promise((resolve) => {
      canvas.toBlob((blob) => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${name}.png`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        resolve();
      }, 'image/png');
    });
    promises.push(promise);
  }
  Promise.all(promises).then(() => {
    setStatus(`✅ 已下载 ${promises.length} 个精灵图！`);
  });
}

generateAll();
